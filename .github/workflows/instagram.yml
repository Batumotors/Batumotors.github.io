name: Actualizar Instagram

on:
  schedule:
    - cron: '0 11 * * *'   # una vez al día
  workflow_dispatch:        # permite ejecutarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Leer Instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_ID: '17841441898010673'
        run: node scripts/fetch-instagram.mjs

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data instagram
          git diff --cached --quiet || (git commit -m "Actualizar contenido de Instagram" && git push)
